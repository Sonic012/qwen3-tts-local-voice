name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install pytest numpy soundfile
      - name: Compile Python scripts
        run: python -m compileall -q scripts
      - name: Validate JSON examples
        run: python -m json.tool examples/manifest.example.json > /dev/null && python -m json.tool examples/voice-designs.example.json > /dev/null
      - name: Run unit tests
        run: pytest -q
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
